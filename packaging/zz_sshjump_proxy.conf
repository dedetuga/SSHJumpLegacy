# SSH Jump: reverse-proxy the control endpoint to the app's Unix socket using
# standard mod_proxy_http. The Axis classic path (mod_trax + TransferMethodProxy)
# uses a proprietary fd-passing IPC ("fdipc") in which mod_trax binds the socket
# itself; a Go daemon can't speak that, and our listener collides with it
# (errno 98 EADDRINUSE). mod_proxy_http instead simply CONNECTS to our socket.
#
# Auth: AuthType/realm are inherited from the camera's global /local config; we
# additionally require the admin group, matching the static files' protection.
ProxyPass        /local/sshjump/control.cgi  "unix:/var/run/http/sshjump/http|http://sshjump.acap/control.cgi"
ProxyPassReverse /local/sshjump/control.cgi  "unix:/var/run/http/sshjump/http|http://sshjump.acap/control.cgi"
<Location "/local/sshjump/control.cgi">
    Require axis-group admin
</Location>
